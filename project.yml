name: NexusCustomizer

options:
  bundleIdPrefix: com.nexus
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

targets:
  NexusCustomizer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NexusCustomizer/App
      - path: NexusCustomizer/Core
      - path: NexusCustomizer/Features
      - path: NexusCustomizer/Resources/Assets.xcassets
    info:
      path: NexusCustomizer/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexus.customizer
        INFOPLIST_FILE: NexusCustomizer/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: CoreText.framework
      - sdk: UniformTypeIdentifiers.framework
