name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build -project NexusCustomizer.xcodeproj -scheme NexusCustomizer -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NexusCustomizer.app Payload/
          zip -r NexusCustomizer.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NexusCustomizer-ipa
          path: NexusCustomizer.ipa
