name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode 16.2
      run: |
        sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || \
        sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Project
      run: xcodegen generate

    - name: Fix Project Format
      run: |
        PBX="NexusCustomizer.xcodeproj/project.pbxproj"
        if [ -f "$PBX" ]; then
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' "$PBX"
          sed -i '' 's/objectVersion = 70;/objectVersion = 60;/g' "$PBX"
        fi

    - name: Build App
      run: |
        xcodebuild build \
          -project NexusCustomizer.xcodeproj \
          -scheme NexusCustomizer \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO

    - name: Package IPA
      run: |
        mkdir Payload
        cp -R build/Build/Products/Release-iphoneos/NexusCustomizer.app Payload/
        zip -r NexusCustomizer.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexusCustomizer-ipa
        path: NexusCustomizer.ipa
