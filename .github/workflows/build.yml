name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate .xcodeproj
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project NexusCustomizer.xcodeproj \
            -scheme NexusCustomizer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NexusCustomizer.app Payload/
          zip -qry NexusCustomizer.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: NexusCustomizer-ipa
          path: NexusCustomizer.ipa
          if-no-files-found: error

      - name: Upload build log (при ошибке)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
